    /* =========================================================
   FLOATING WHATSAPP BUTTON
   ========================================================= */

.floating-whatsapp {
  position: fixed;

  right: 25px;
  bottom: 90px;

  width: 58px;
  height: 58px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #25D366;
  color: #ffffff;

  border-radius: 50%;
  text-decoration: none;

  font-size: 30px;

  box-shadow: 0 5px 18px rgba(0, 0, 0, 0.25);

  z-index: 9999;

  transition:
    transform 0.3s ease,
    box-shadow 0.3s ease,
    background-color 0.3s ease;
}

.floating-whatsapp:hover {
  background: #20b957;
  color: #ffffff;

  transform: translateY(-4px) scale(1.05);

  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
}

.floating-whatsapp i {
  margin: 0;
}

/* WhatsApp pulse */
.floating-whatsapp::before {
  content: "";

  position: absolute;
  inset: -4px;

  border: 2px solid rgba(37, 211, 102, 0.45);
  border-radius: 50%;

  animation: whatsappPulse 2s infinite;
}

@keyframes whatsappPulse {
  0% {
    transform: scale(1);
    opacity: 0.8;
  }

  70% {
    transform: scale(1.25);
    opacity: 0;
  }

  100% {
    transform: scale(1.25);
    opacity: 0;
  }
}

/* Mobile */
@media (max-width: 600px) {

  .floating-whatsapp {
    right: 18px;
    bottom: 78px;

    width: 54px;
    height: 54px;

    font-size: 27px;
  }

}

    /* =========================================================

.social-contact {

}

.social-contact h3 {

/* Social icon container */
.social-icons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
}

/* Individual social icons */
.social-icon {
  width: 52px;
  height: 52px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;
  text-decoration: none;

  color: #ffffff;
  font-size: 22px;

  position: relative;

  transition:
    transform 0.3s ease,
    box-shadow 0.3s ease,
    background 0.3s ease;
}

/* WhatsApp */
.social-icon.whatsapp {
  background: #25d366;
  box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
}

/* Instagram */
.social-icon.instagram {
  background: linear-gradient(
    135deg,
    #833ab4,
    #fd1d1d,
    #fcb045
  );

  box-shadow: 0 5px 15px rgba(225, 48, 108, 0.3);
}

/* TikTok */
.social-icon.tiktok {
  background: #111111;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
}

/* Hover effect */
.social-icon:hover {
  transform: translateY(-5px) scale(1.08);
  color: #ffffff;
}

/* Individual hover shadows */
.social-icon.whatsapp:hover {
  box-shadow: 0 10px 25px rgba(37, 211, 102, 0.45);
}

.social-icon.instagram:hover {
  box-shadow: 0 10px 25px rgba(225, 48, 108, 0.45);
}

.social-icon.tiktok:hover {
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
}

/* Subtle outer ring */
.social-icon::before {
  content: "";
  position: absolute;
  inset: -3px;

  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.2);

  opacity: 0;
  transform: scale(0.8);

  transition:
    opacity 0.3s ease,
    transform 0.3s ease;
}

.social-icon:hover::before {
  opacity: 1;
  transform: scale(1);
}

/* Mobile */
@media (max-width: 600px) {

</script>
