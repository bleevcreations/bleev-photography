<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BLEEV CREATIONS</title>
  <link rel="icon" type="image/png" href="assets/logos/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: url('assets/logos/logo3.jpg') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.6);
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .branding {
      color: white;
      text-align: center;
      padding: 40px 20px;
      border-radius: 12px;
      max-width: 700px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 5px;
      background: linear-gradient(90deg, #ff6a00, rgba(255, 215, 0, 0.5), #ee0979);


      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
      animation: glow 3s ease-in-out infinite alternate;
      background-size: 300% 300%;
      background-position: center;
    }

    @keyframes glow {
      0% {
        text-shadow: 2px 2px 4px rgba(255, 106, 0, 0.6);
      }
      100% {
        text-shadow: 2px 2px 12px rgba(255, 215, 0, 0.5);
      }
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 30px;
      font-style: italic;
      letter-spacing: 1px;
      line-height: 1.4;
      opacity: 0.9;
    }

    .get-started-btn {
      background-color: #ffffff;
      color: #000;
      padding: 15px 30px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
      transition: all 0.3s ease-in-out;
    }

    .get-started-btn:hover {
      background-color: #000;
      color: #fff;
      border: 1px solid #fff;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.5rem;
      }

      p {
        font-size: 1rem;
      }

      .get-started-btn {
        width: 80%;
      }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="branding">
      <h1>BLEEV CREATIONS</h1>
      <p>Capturing Moments. Creating Stories. One Frame at a Time.</p>
      <a href="homepage.html">
        <button class="get-started-btn">Get Started</button>
      </a>
    </div>
  </div>
</body>
</html>
