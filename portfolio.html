<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio | Capturing Moments</title>
  <link rel="icon" type="image/png" href="assets/logos/favicon.png">
  <link rel="stylesheet" href="css/style.css" />
<style>
   /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      padding: 1.5rem 1rem;

      text-align: center;

      background:
        linear-gradient(
          135deg,
          #052a4a,
          #2b5876,
          #4e4376
        );

      color: rgba(255, 255, 255, 0.85);
    }

    footer p {
      margin: 0;

      font-family:
        "Playfair Display",
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 0.9rem;

      letter-spacing: 0.04em;
    }
</style>
</head>
<body class="portfolio-page">

  <header class="page-header">
    <h1>Portfolio</h1>
    <p class="page-sub">Every frame tells a story — explore our work by category.</p>

    <div class="filter-tabs" id="filterTabs">
      <button class="active" type="button" data-filter="all">All</button>
    </div>
  </header>

  <main>
    <section class="gallery-section">
      <div class="portfolio-grid" id="portfolioGrid"></div>
    </section>
  </main>

 <footer>
  <p>
    © 2022   Bleev Creations.
    All Rights Reserved
  </p>
</footer>

  <!-- Category lightbox -->
  <div class="cat-lightbox" id="catLightbox" aria-hidden="true">
    <div class="lb-body">

      <button
        class="lb-nav-btn"
        id="lbClose"
        type="button"
        aria-label="Close gallery"
      >&times;</button>

      <h2 id="lbTitle">Category</h2>

      <button
        class="lb-nav-btn"
        id="lbPrev"
        type="button"
        aria-label="Previous image"
      >&#8249;</button>

      <img id="lbMainImg" src="" alt="" />

      <button
        class="lb-nav-btn"
        id="lbNext"
        type="button"
        aria-label="Next image"
      >&#8250;</button>

      <div id="lbThumbs"></div>
    </div>
  </div>

  <script src="js/portfolio.js"></script>
</body>
</html>
