<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>About Me - Bleev Photography</title>
  <link rel="icon" type="image/png" href="assets/logos/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('/assets/images/image-b13.png') no-repeat center center fixed;
      background-size: cover;
      color: #333;
      line-height: 1.6;
    }

    .about-section {
      max-width: 900px;
      margin: 60px auto;
      padding: 40px 30px;
      background-color: rgba(255, 255, 255, 0.92);
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .about-img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #007bff;
      margin-bottom: 25px;
    }

    .about-text {
      font-size: 1.1rem;
      color: #333;
      line-height: 1.8;
      padding: 0 10px;
      white-space: pre-line;
    }

    footer {
      background-color: rgba(0, 0, 0, 0.8);
      color: #eee;
      padding: 40px 20px;
      text-align: center;
      margin-top: 80px;
    }

    footer h3 {
      color: #fff;
      margin-bottom: 10px;
    }

    footer p {
      font-size: 0.95rem;
      margin: 5px 0;
    }

    footer a {
      color: #00bcd4;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .about-section {
        padding: 30px 15px;
      }

      .about-text {
        font-size: 1rem;
      }

      .about-img {
        width: 140px;
        height: 140px;
      }
    }
  </style>
</head>
<body>

  <section class="about-section">
    <img id="aboutImg" alt="Photographer" class="about-img" hidden>
    <p class="about-text" id="aboutText">Loading...</p>
  </section>

  <footer>
    <h3>Contact Bleev Photography</h3>
    <p>Email: <a href="mailto:bleevcreations@gmail.com">bleevcreations@gmail.com</a></p>
    <p>Phone:+254 768 572 974 </p>
    <p>© <span id="year"></span> Bleev Creations. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    fetch("/api/about")
      .then((r) => r.json())
      .then((data) => {
        document.getElementById("aboutText").textContent = data.description || "";
        if (data.profilePicture) {
          const img = document.getElementById("aboutImg");
          img.src = "/api/image?id=" + encodeURIComponent(data.profilePicture);
          img.hidden = false;
        }
      })
      .catch(() => {
        document.getElementById("aboutText").textContent = "Could not load this page. Please try again later.";
      });
  </script>

</body>
</html>
