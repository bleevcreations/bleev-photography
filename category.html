<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Category | Bleev Creations</title>
  <link rel="icon" type="image/png" href="assets/logos/favicon.png">

  <link rel="stylesheet" href="css/style.css" />
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

  <style>
    /* =========================================================
       GLOBAL
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f8f8f8;
      color: #222;
    }

    /* =========================================================
       CATEGORY HEADER
       ========================================================= */

    #categoryHeader {
  position: sticky;
  z-index: 10;

  min-height: 380px;

  display: flex;
  align-items: center;
  justify-content: center;

  background-color: #052a4a;
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;

  overflow: hidden;
}

    #categoryHeader::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          135deg,
          rgba(5, 42, 74, 0.85) 0%,
          rgba(43, 88, 118, 0.48) 45%,
          rgba(78, 67, 118, 0.78) 100%
        );

      z-index: 1;
    }

    .header-overlay {
      position: relative;
      z-index: 2;

      width: 100%;
      padding: 40px 20px;

      text-align: center;
    }

    #categoryTitle {
      margin: 0;

      color: #ffffff;

      font-family:
        "Playfair Display",
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 700;

      letter-spacing: 0.04em;
      line-height: 1.1;

      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    /* =========================================================
       GALLERY SECTION
       ========================================================= */

    .gallery-section {
      padding: 4rem 2rem;

      background:
        linear-gradient(
          135deg,
          #ffffff 0%,
          #f8f8f8 55%,
          #f0eef5 100%
        );
    }

    .gallery-section h2 {
      margin: 0 0 2rem;

      text-align: center;

      color: #052a4a;

      font-family:
        "Playfair Display",
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 700;
    }

    #averageRating {
      display: inline-block;

      margin-left: 8px;

      color: #d4af37;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.85em;
      font-weight: 700;
    }

    .gallery-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 1.2rem;

      max-width: 1400px;
      margin: 0 auto;
    }

    .gallery-grid img {
      display: block;

      width: 100%;
      height: 320px;

      object-fit: cover;

      border-radius: 10px;

      cursor: pointer;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.12);

      transition:
        transform 0.35s ease,
        box-shadow 0.35s ease;
    }

    .gallery-grid img:hover {
      transform: translateY(-5px) scale(1.01);

      box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.2);
    }

    

    /* =========================================================
       REVIEWS SECTION
       ========================================================= */

    .reviews-section {
      padding: 3rem 2rem;

      background:
        linear-gradient(
          135deg,
          #052a4a 0%,
          #173f5f 45%,
          #4e4376 100%
        );

      color: #ffffff;
    }

    .reviews-section > h2 {
      margin: 0 0 2rem;

      text-align: center;

      font-family:
        "Playfair Display",
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
    }

    /* =========================================================
       REVIEWS GRID
       ========================================================= */

    #reviews-list {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 1.2rem;

      max-width: 1100px;
      margin: 1.5rem auto 0;
    }

    .review {
      padding: 1.3rem;

      margin-bottom: 0;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.12),
          rgba(255, 255, 255, 0.05)
        );

      border: 1px solid rgba(255, 255, 255, 0.12);

      border-radius: 10px;

      color: #f5f5f5;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.15);

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    .review:hover {
      transform: translateY(-3px);

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.22);
    }

    .review.hidden-review {
      display: none;
    }

    .review strong {
      display: block;

      margin-bottom: 7px;

      color: #ffffff;

      font-size: 1rem;
      font-weight: 700;
    }

    .review > div {
      margin-bottom: 10px;

      color: #d4af37;

      letter-spacing: 1px;
    }

    .review p {
      margin: 0 0 10px;

      color: rgba(255, 255, 255, 0.9);

      line-height: 1.6;
    }

    .review small {
      color: rgba(255, 255, 255, 0.6);
    }

    /* =========================================================
       VIEW ALL REVIEWS BUTTON
       ========================================================= */

    .reviews-toggle-container {
      display: flex;

      justify-content: center;

      margin-top: 2rem;
    }

    #reviewsToggle {
      padding: 11px 26px;

      font-size: 0.9rem;
      font-weight: 700;

      letter-spacing: 0.05em;

      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #2b5876,
          #4e4376
        );

      border: 1px solid rgba(255, 255, 255, 0.25);

      border-radius: 30px;

      cursor: pointer;

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        background 0.3s ease;
    }

    #reviewsToggle:hover {
      transform: translateY(-2px);

      background:
        linear-gradient(
          135deg,
          #d4af37,
          #b89225
        );

      box-shadow:
        0 7px 20px rgba(212, 175, 55, 0.3);
    }

    /* =========================================================
       REVIEW FORM
       ========================================================= */

    .reviews-section h3 {
      max-width: 700px;

      margin: 3rem auto 1rem;

      color: #ffffff;

      font-family:
        "Playfair Display",
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 1.6rem;
    }

    #review-form {
      max-width: 700px;

      margin: 0 auto;
    }

    #review-form input,
    #review-form textarea {
      width: 100%;

      margin-bottom: 1rem;
      padding: 13px 15px;

      border: 1px solid rgba(255, 255, 255, 0.2);

      border-radius: 7px;

      background: rgba(255, 255, 255, 0.95);

      color: #222;

      font-family: inherit;

      outline: none;
    }

    #review-form input:focus,
    #review-form textarea:focus {
      border-color: #d4af37;

      box-shadow:
        0 0 0 3px rgba(212, 175, 55, 0.15);
    }

    #review-form textarea {
      min-height: 130px;

      resize: vertical;
    }

    /* =========================================================
       STAR RATING
       ========================================================= */

    .star-rating {
      display: flex;

      gap: 5px;

      margin-bottom: 1rem;
    }

    .star-rating label {
      color: #888;

      font-size: 1.7rem;

      cursor: pointer;

      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    .star-rating label:hover {
      transform: scale(1.1);
    }

    .star-rating label.active {
      color: #d4af37;
    }

    /* =========================================================
       SUBMIT BUTTON
       ========================================================= */

    #review-form button[type="submit"] {
      display: inline-block;

      padding: 12px 28px;

      border: none;
      border-radius: 30px;

      background:
        linear-gradient(
          135deg,
          #2b5876,
          #4e4376
        );

      color: #ffffff;

      font-size: 0.95rem;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    #review-form button[type="submit"]:hover {
      transform: translateY(-2px);

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.25);
    }

    /* =========================================================
       LIGHTBOX
       ========================================================= */

    #lightbox {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 9999;

      align-items: center;
      justify-content: center;

      padding: 30px;

      background: rgba(0, 0, 0, 0.92);
    }

    #lightbox.active {
      display: flex;
    }

    #lightbox img {
      max-width: 90vw;
      max-height: 85vh;

      object-fit: contain;

      border-radius: 5px;

      box-shadow:
        0 15px 50px rgba(0, 0, 0, 0.5);
    }

    .lightbox-close,
    .lightbox-prev,
    .lightbox-next {
      position: absolute;

      border: none;

      background: transparent;

      color: #ffffff;

      font-size: 2.5rem;

      cursor: pointer;

      z-index: 2;

      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    .lightbox-close:hover,
    .lightbox-prev:hover,
    .lightbox-next:hover {
      color: #d4af37;

      transform: scale(1.1);
    }

    .lightbox-close {
      top: 20px;
      right: 30px;
    }

    .lightbox-prev {
      left: 25px;
      top: 50%;

      transform: translateY(-50%);
    }

    .lightbox-next {
      right: 25px;
      top: 50%;

      transform: translateY(-50%);
    }

    .lightbox-prev:hover,
    .lightbox-next:hover {
      transform: translateY(-50%) scale(1.1);
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      padding: 1.5rem 1rem;

      text-align: center;

      background:
        linear-gradient(
          135deg,
          #052a4a,
          #2b5876,
          #4e4376
        );

      color: rgba(255, 255, 255, 0.85);
    }

    footer p {
      margin: 0;

      font-family:
        "Playfair Display",
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 0.9rem;

      letter-spacing: 0.04em;
    }

    /* =========================================================
   FLOATING WHATSAPP BUTTON
   ========================================================= */

.floating-whatsapp {
  position: fixed;
  right: 25px;
  bottom: 90px;

  width: 58px;
  height: 58px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #25D366;
  color: #ffffff;

  border-radius: 50%;
  text-decoration: none;

  font-size: 30px;

  box-shadow:
    0 5px 18px rgba(0, 0, 0, 0.25);

  z-index: 9999;

  transition:
    transform 0.3s ease,
    box-shadow 0.3s ease,
    background-color 0.3s ease;
}

/* Hover */
.floating-whatsapp:hover {
  background: #20b957;
  color: #ffffff;

  transform:
    translateY(-4px)
    scale(1.05);

  box-shadow:
    0 8px 25px rgba(0, 0, 0, 0.3);
}

/* WhatsApp icon */
.floating-whatsapp i {
  margin: 0;
  line-height: 1;
}

/* Pulse ring */
.floating-whatsapp::before {
  content: "";

  position: absolute;
  inset: -4px;

  border: 2px solid rgba(37, 211, 102, 0.45);

  border-radius: 50%;

  animation: whatsappPulse 2s infinite;

  pointer-events: none;
}

@keyframes whatsappPulse {

  0% {
    transform: scale(1);
    opacity: 0.8;
  }

  70% {
    transform: scale(1.25);
    opacity: 0;
  }

  100% {
    transform: scale(1.25);
    opacity: 0;
  }

}

/* Mobile */
@media (max-width: 600px) {

  .floating-whatsapp {
    right: 18px;
    bottom: 78px;

    width: 54px;
    height: 54px;

    font-size: 27px;
  }

}

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 900px) {
      .gallery-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .gallery-grid img {
        height: 280px;
      }
    }

    @media (max-width: 700px) {
      #categoryHeader {
        min-height: 300px;
      }

      .gallery-section {
        padding: 3rem 1rem;
      }

      .reviews-section {
        padding: 3rem 1rem;
      }

      #reviews-list {
        grid-template-columns: 1fr;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .gallery-grid img {
        height: 320px;
      }

      .lightbox-prev {
        left: 10px;
      }

      .lightbox-next {
        right: 10px;
      }

      .lightbox-close {
        right: 15px;
      }
    }

    @media (max-width: 480px) {
      #categoryHeader {
        min-height: 260px;
      }

      #categoryTitle {
        font-size: 2.3rem;
      }

      .gallery-grid img {
        height: 280px;
      }

      #reviewsToggle {
        width: 100%;
        max-width: 250px;
      }
    }
    
  /* =========================================================
   FLOATING REVIEWS BUTTON
   ========================================================= */

.floating-reviews-btn {
  position: fixed;

  right: 24px;
  bottom: 24px;

  z-index: 999;

  display: flex;
  align-items: center;
  gap: 8px;

  padding: 12px 18px;

  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 30px;

  background:
    linear-gradient(
      135deg,
      #2b5876,
      #4e4376
    );

  color: #ffffff;

  font-family:
    "Playfair Display",
    "Cormorant Garamond",
    Georgia,
    serif;

  font-size: 0.9rem;
  font-weight: 700;

  letter-spacing: 0.04em;

  cursor: pointer;

  box-shadow:
    0 8px 25px rgba(0, 0, 0, 0.25);

  transition:
    transform 0.3s ease,
    box-shadow 0.3s ease,
    background 0.3s ease;
}

.floating-reviews-btn:hover {
  transform: translateY(-3px);

  background:
    linear-gradient(
      135deg,
      #d4af37,
      #b89225
    );

  box-shadow:
    0 12px 30px rgba(0, 0, 0, 0.3);
}

.floating-reviews-btn span {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 1rem;
}

@media (max-width: 600px) {
  .floating-reviews-btn {
    right: 15px;
    bottom: 15px;

    padding: 11px 15px;

    font-size: 0.8rem;
  }
}

  </style>
</head>

<body>

  <!-- =========================================================
     FLOATING REVIEWS BUTTON
     ========================================================= -->

  <button
  type="button"
  class="floating-reviews-btn"
  id="floatingReviewsBtn"
  aria-label="Go to reviews"
    >
      <span>★</span>
      Reviews
    </button>

  <!-- =========================================================
       CATEGORY HEADER
       ========================================================= -->

  <header id="categoryHeader">
    <div class="header-overlay">
      <h1 id="categoryTitle">Category</h1>
    </div>
  </header>


  <!-- =========================================================
       MAIN CONTENT
       ========================================================= -->

  <main>

    <!-- =======================================================
         GALLERY
         ======================================================= -->

    <section class="gallery-section">

      <h2 id="categoryName">
        Loading...
        <span id="averageRating"></span>
      </h2>

      <div
        id="categoryGallery"
        class="gallery-grid">
      </div>

    </section>

    <!-- Floating WhatsApp Button -->
<a
  href="https://wa.me/254768572974"
  target="_blank"
  rel="noopener noreferrer"
  class="floating-whatsapp"
  title="Chat with Bleev Creations on WhatsApp"
  aria-label="Chat with Bleev Creations on WhatsApp"
>
  <i class="fab fa-whatsapp"></i>
</a>


    <!-- =======================================================
         REVIEWS
         ======================================================= -->

    <section class="reviews-section">

      <h2>What Clients Say</h2>

      <!-- Reviews are dynamically inserted here -->
      <div id="reviews-list"></div>


      <!-- View All / Show Less -->
      <div
        id="reviews-toggle-container"
        class="reviews-toggle-container"
        style="display: none;"
      >
        <button
          id="reviewsToggle"
          type="button"
          data-expanded="false"
        >
          View All Reviews
        </button>
      </div>


      <!-- =====================================================
           REVIEW FORM
           ===================================================== -->

      <h3>Leave a Review</h3>

      <form id="review-form">

        <input
          type="text"
          id="reviewName"
          name="name"
          placeholder="Your Name"
          required
        />

        <textarea
          id="reviewText"
          name="text"
          placeholder="Write your review..."
          required
        ></textarea>


        <!-- Star Rating -->

        <div class="star-rating">

          <label data-value="1">★</label>
          <label data-value="2">★</label>
          <label data-value="3">★</label>
          <label data-value="4">★</label>
          <label data-value="5">★</label>

        </div>

        <input
          type="hidden"
          id="reviewRating"
          name="rating"
          value="5"
        />

        <input
          type="hidden"
          id="reviewCategoryId"
          name="category_id"
        />

        <button type="submit">
          Submit Review
        </button>

      </form>

    </section>

  </main>


  <!-- =========================================================
       FOOTER
       ========================================================= -->

  <footer>
  <p>
    © 2022   Bleev Creations. 
    All Rights Reserved
  </p>
</footer>



  <!-- =========================================================
       LIGHTBOX
       ========================================================= -->

  <div id="lightbox">

    <button
      class="lightbox-close"
      type="button"
      aria-label="Close"
    >
      &times;
    </button>

    <button
      class="lightbox-prev"
      type="button"
      aria-label="Previous image"
    >
      &#10094;
    </button>

    <img
      id="lightboxImage"
      src=""
      alt="Gallery image"
    />

    <button
      class="lightbox-next"
      type="button"
      aria-label="Next image"
    >
      &#10095;
    </button>

  </div>


  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script>

    /* =========================================================
       VARIABLES
       ========================================================= */

    const params = new URLSearchParams(window.location.search);

    const categoryId = params.get("id");

    let imageList = [];

    let currentIndex = 0;



      /* =========================================================
       FLOATING REVIEWS BUTTON — scroll to reviews
       ========================================================= */

    document
      .getElementById("floatingReviewsBtn")
      .addEventListener("click", () => {

        document
          .querySelector(".reviews-section")
          .scrollIntoView({ behavior: "smooth", block: "start" });

      });


    /* =========================================================
       LOAD CATEGORY DETAILS
       ========================================================= */

    async function loadCategoryDetails() {

      if (!categoryId) {

        document.getElementById("categoryTitle").textContent =
          "Category Not Found";

        document.getElementById("categoryName").textContent =
          "Category Not Found";

        return;
      }

      try {

        const response =
          await fetch(
            `/api/categories?id=${encodeURIComponent(categoryId)}`
          );

        if (!response.ok) {
          throw new Error("Failed to load category.");
        }

        const data = await response.json();

        if (!data.category) {
          throw new Error("Category not found.");
        }

        const cat = data.category;


        /* =====================================================
           CATEGORY INFORMATION
           ===================================================== */

        document.getElementById("categoryTitle").textContent =
          cat.name;

        document.getElementById("categoryName").childNodes[0].textContent =
          cat.name + " ";


        /* =====================================================
           CATEGORY IMAGES
           ===================================================== */

        imageList = cat.images || [];


        /* =====================================================
           RANDOM HERO IMAGE
           ===================================================== */

        const categoryHeader =
          document.getElementById("categoryHeader");

        if (imageList.length > 0) {

          const randomIndex =
            Math.floor(Math.random() * imageList.length);

          categoryHeader.style.backgroundImage =
  `url("/api/image?id=${encodeURIComponent(imageList[randomIndex])}")`;
        }


        /* =====================================================
           GALLERY
           ===================================================== */

        const gallery =
          document.getElementById("categoryGallery");

        if (imageList.length === 0) {

          gallery.innerHTML = `
            <p style="
              grid-column: 1 / -1;
              text-align: center;
              color: #666;
            ">
              No images available for this category.
            </p>
          `;

        } else {

          gallery.innerHTML =
            imageList.map(
              (image, index) => `
                <img
                  src="/api/image?id=${encodeURIComponent(image)}"
                  alt="${cat.name} - Photo ${index + 1}"
                  loading="lazy"
                  data-index="${index}"
                />
              `
            ).join("");

        }


        /* =====================================================
           GALLERY LIGHTBOX EVENTS
           ===================================================== */

        document
          .querySelectorAll("#categoryGallery img")
          .forEach((img) => {

            img.addEventListener("click", () => {

              currentIndex =
                Number(img.dataset.index);

              openLightbox();

            });

          });


        /* =====================================================
           REVIEW CATEGORY ID
           ===================================================== */

        document.getElementById("reviewCategoryId").value =
          categoryId;


        /* =====================================================
           LOAD REVIEWS
           ===================================================== */

        await loadReviews(true);

      } catch (error) {

        console.error(error);

        document.getElementById("categoryTitle").textContent =
          "Unable to Load Category";

        document.getElementById("categoryName").textContent =
          "Unable to Load Category";

      }

    }


    /* =========================================================
       LOAD REVIEWS
       ========================================================= */

    async function loadReviews(updateAvg = false) {

      const container =
        document.getElementById("reviews-list");

      const toggleContainer =
        document.getElementById("reviews-toggle-container");

      const toggleButton =
        document.getElementById("reviewsToggle");


      try {

        const response =
          await fetch(
            `/api/reviews?category_id=${encodeURIComponent(categoryId)}`
          );

        if (!response.ok) {
          throw new Error("Failed to load reviews.");
        }

        const reviews =
          await response.json();


        /* =====================================================
           NO REVIEWS
           ===================================================== */

        if (!reviews || reviews.length === 0) {

          container.innerHTML = `
            <div
              class="review"
              style="grid-column: 1 / -1; text-align: center;"
            >
              <p>
                No reviews yet. Be the first to leave a review.
              </p>
            </div>
          `;

          toggleContainer.style.display = "none";

          if (updateAvg) {

            document.getElementById("averageRating").textContent =
              "";

          }

          return;
        }


        /* =====================================================
           RENDER REVIEWS
           
           First 4 are visible.
           Remaining reviews receive hidden-review.
           ===================================================== */

        container.innerHTML =
          reviews.map(
            (r, index) => `
              <div
                class="review ${index >= 4 ? "hidden-review" : ""}"
              >

                <strong>
                  ${escapeHtml(r.name)}
                </strong>

                <div>
                  ${"⭐".repeat(Number(r.rating))}
                  ${"☆".repeat(5 - Number(r.rating))}
                </div>

                <p>
                  ${escapeHtml(r.text)}
                </p>

                <small>
                  ${escapeHtml(r.date)}
                </small>

              </div>
            `
          ).join("");


        /* =====================================================
           VIEW ALL BUTTON
           ===================================================== */

        if (reviews.length > 4) {

          toggleContainer.style.display = "flex";

          toggleButton.textContent =
            "View All Reviews";

          toggleButton.dataset.expanded =
            "false";

        } else {

          toggleContainer.style.display =
            "none";

        }


        /* =====================================================
           AVERAGE RATING
           
           Calculated using ALL reviews, not only
           the four currently visible.
           ===================================================== */

        if (updateAvg) {

          const total =
            reviews.reduce(
              (sum, review) =>
                sum + Number(review.rating),
              0
            );

          const average =
            total / reviews.length;

          document.getElementById("averageRating").textContent =
            `★ ${average.toFixed(1)} (${reviews.length})`;

        }

      } catch (error) {

        console.error(error);

        container.innerHTML = `
          <div
            class="review"
            style="grid-column: 1 / -1; text-align: center;"
          >
            <p>
              Unable to load reviews at the moment.
            </p>
          </div>
        `;

        toggleContainer.style.display = "none";

      }

    }


    /* =========================================================
       VIEW ALL / SHOW LESS
       ========================================================= */

    document
      .getElementById("reviewsToggle")
      .addEventListener("click", () => {

        const reviews =
          document.querySelectorAll(
            "#reviews-list .review"
          );

        const button =
          document.getElementById("reviewsToggle");

        const isExpanded =
          button.dataset.expanded === "true";


        /* =====================================================
           SHOW ALL
           ===================================================== */

        if (!isExpanded) {

          reviews.forEach((review) => {

            review.classList.remove(
              "hidden-review"
            );

          });

          button.textContent =
            "Show Less";

          button.dataset.expanded =
            "true";

        }


        /* =====================================================
           SHOW ONLY FIRST 4
           ===================================================== */

        else {

          reviews.forEach(
            (review, index) => {

              if (index >= 4) {

                review.classList.add(
                  "hidden-review"
                );

              }

            }
          );

          button.textContent =
            "View All Reviews";

          button.dataset.expanded =
            "false";


          /* Scroll back to reviews */

          document
            .getElementById("reviews-list")
            .scrollIntoView({
              behavior: "smooth",
              block: "start"
            });

        }

      });


    /* =========================================================
       REVIEW FORM SUBMISSION
       ========================================================= */

    document
      .getElementById("review-form")
      .addEventListener("submit", async (event) => {

        event.preventDefault();

        const form =
          event.target;

        const formData =
          new FormData(form);


        try {

          const response =
            await fetch(
              "/api/reviews",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(
                  Object.fromEntries(formData)
                )
              }
            );


          const result =
            await response.json();


          if (!response.ok || result.success === false) {

            throw new Error(
              result.message ||
              "Unable to submit review."
            );

          }


          alert(
            result.message ||
            "Thank you for your review!"
          );


          /* Reset form */

          form.reset();

          document.getElementById(
            "reviewRating"
          ).value = "5";


          /* Reset stars */

          document
            .querySelectorAll(".star-rating label")
            .forEach((star) => {

              star.classList.remove(
                "active"
              );

            });


          document
            .querySelectorAll(".star-rating label")
            .forEach((star) => {

              if (
                Number(star.dataset.value) <= 5
              ) {

                star.classList.add(
                  "active"
                );

              }

            });


          /* Reload reviews */

          await loadReviews(true);

        } catch (error) {

          console.error(error);

          alert(
            error.message ||
            "Unable to submit your review."
          );

        }

      });


    /* =========================================================
       STAR RATING
       ========================================================= */

    const stars =
      document.querySelectorAll(
        ".star-rating label"
      );

    const ratingInput =
      document.getElementById(
        "reviewRating"
      );


    function updateStars(value) {

      stars.forEach((star) => {

        const starValue =
          Number(star.dataset.value);

        if (starValue <= value) {

          star.classList.add(
            "active"
          );

        } else {

          star.classList.remove(
            "active"
          );

        }

      });

    }


    stars.forEach((star) => {

      star.addEventListener(
        "mouseenter",
        () => {

          updateStars(
            Number(star.dataset.value)
          );

        }
      );


      star.addEventListener(
        "click",
        () => {

          const value =
            Number(star.dataset.value);

          ratingInput.value =
            value;

          updateStars(value);

        }
      );

    });


    document
      .querySelector(".star-rating")
      .addEventListener(
        "mouseleave",
        () => {

          updateStars(
            Number(ratingInput.value)
          );

        }
      );


    /* =========================================================
       INITIAL STAR STATE
       ========================================================= */

    updateStars(5);


    /* =========================================================
       LIGHTBOX
       ========================================================= */

    const lightbox =
      document.getElementById(
        "lightbox"
      );

    const lightboxImage =
      document.getElementById(
        "lightboxImage"
      );


    function openLightbox() {

      if (
        !imageList.length ||
        !imageList[currentIndex]
      ) {
        return;
      }

      lightboxImage.src =
  `/api/image?id=${encodeURIComponent(imageList[currentIndex])}`;

      lightbox.classList.add(
        "active"
      );

      document.body.style.overflow =
        "hidden";

    }


    function closeLightbox() {

      lightbox.classList.remove(
        "active"
      );

      document.body.style.overflow =
        "";

    }


    function showPreviousImage() {

      if (!imageList.length) {
        return;
      }

      currentIndex =
        (currentIndex - 1 + imageList.length) %
        imageList.length;

      openLightbox();

    }


    function showNextImage() {

      if (!imageList.length) {
        return;
      }

      currentIndex =
        (currentIndex + 1) %
        imageList.length;

      openLightbox();

    }


    /* =========================================================
       LIGHTBOX BUTTON EVENTS
       ========================================================= */

    document
      .querySelector(".lightbox-close")
      .addEventListener(
        "click",
        closeLightbox
      );


    document
      .querySelector(".lightbox-prev")
      .addEventListener(
        "click",
        showPreviousImage
      );


    document
      .querySelector(".lightbox-next")
      .addEventListener(
        "click",
        showNextImage
      );


    /* =========================================================
       CLOSE LIGHTBOX BY CLICKING BACKGROUND
       ========================================================= */

    lightbox.addEventListener(
      "click",
      (event) => {

        if (
          event.target === lightbox
        ) {

          closeLightbox();

        }

      }
    );


    /* =========================================================
       KEYBOARD CONTROLS
       ========================================================= */

    document.addEventListener(
      "keydown",
      (event) => {

        if (
          !lightbox.classList.contains(
            "active"
          )
        ) {
          return;
        }


        if (
          event.key === "Escape"
        ) {

          closeLightbox();

        }


        if (
          event.key === "ArrowLeft"
        ) {

          showPreviousImage();

        }


        if (
          event.key === "ArrowRight"
        ) {

          showNextImage();

        }

      }
    );


    /* =========================================================
       ESCAPE HTML
       Prevents review content from being interpreted
       as HTML.
       ========================================================= */

    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================================================
       LOAD PAGE
       ========================================================= */

    loadCategoryDetails();

  </script>

</body>
</html>
